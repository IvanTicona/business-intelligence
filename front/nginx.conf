server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cloudflare ya comprime, pero si alguien pega directo al origen esto ayuda
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  client_max_body_size 2m;

  # API: mismo origen que el front, así no hay CORS ni URL horneada en el bundle
  location /api/ {
    proxy_pass http://back:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 30s;
  }

  # El motor SQL de las prácticas 3 y 4 es SQLite compilado a WebAssembly.
  # nginx ya mapea .wasm desde 1.21.5, pero si el MIME llegara a fallar el
  # navegador rechaza instantiateStreaming y el playground queda sin base.
  # default_type solo actúa si la tabla de tipos no resolvió: es una red de
  # seguridad, no un override.
  location ~ \.wasm$ {
    default_type application/wasm;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Assets con hash en el nombre: cache agresivo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier ruta cae en index.html (necesario para /docente/entregas)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # El HTML nunca se cachea, si no los deploys quedan pegados
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }
}
